services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-mmh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_mmh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_mmh"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: erp-mmh-postgres-data
