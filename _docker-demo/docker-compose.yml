# ERP MM HIGH METRIK · DEMO autocontenida (app + Postgres con la data ya cargada).
# En la PC destino:  docker compose up -d   →   abrir  http://localhost:3001
services:
  db:
    image: postgres:18-alpine
    container_name: erp-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_mmh_test
    volumes:
      - erp-mmh-test-data:/var/lib/postgresql
      # Postgres corre los *.sql de initdb.d en el primer arranque (sin shell · cross-platform)
      - ./db-init/01-restore.sql:/docker-entrypoint-initdb.d/01-restore.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_mmh_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: _docker-demo/Dockerfile
    image: erp-demo:latest
    container_name: erp-demo-app
    restart: unless-stopped
    env_file: .env            # ← copia aquí tu .env (trae GEMINI/ANTHROPIC/NAS keys)
    environment:              # estas mandan sobre el .env (DB apunta al contenedor)
      DATABASE_URL: postgresql://erp:erp@db:5432/erp_mmh_test
      # PUBLIC_ORIGIN = como llega el navegador. En una PC local queda el default; para el VPS se
      # exporta antes del `up` (ej. PUBLIC_ORIGIN=http://144.126.150.128:3001).
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3001}
      NODE_ENV: production
      # Sin HTTPS el navegador DESCARTA la cookie `secure` y el login rebota sin mensaje. Servido
      # por IP → 0. Con dominio y certificado, subirlo a 1.
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      SERVE_STATIC: "1"
      FRONTEND_DIST: /app/apps/frontend/dist
      PORT: "3001"
    ports:
      - "${APP_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  erp-mmh-test-data:
    name: erp-mmh-test-data
